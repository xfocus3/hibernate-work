name: Resume scoped checks for HHH-21073
on:
  push:
    branches: [sandcastle/dot-checkpoint/HHH-21073-20261107]
    paths: [.github/workflows/hhh21073-dispatch-scoped.yml]
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const head = '5227b22b97bd04af7d9fdf0603599b31b2bce245';
            const pr = (await github.rest.pulls.get({ ...context.repo, pull_number: 49 })).data;
            if (pr.state !== 'open' || pr.head.sha !== head || pr.head.repo.full_name !== 'xfocus3/hibernate-work') throw new Error('Work PR changed');
            const plan = await github.rest.repos.getContent({ ...context.repo, path: '.sandcastle/verification-plans/49.json', ref: 'main' });
            if (plan.data.type !== 'file') throw new Error('Verification plan missing');
            const runs = (await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'scoped-java.yml', event: 'workflow_dispatch', per_page: 100 })).data.workflow_runs;
            const existing = runs.find(run => run.display_title === 'Sandcastle Java checks: ' + head && run.id !== 42401478849);
            if (existing) { core.info('Existing scoped run: ' + existing.html_url); return; }
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'scoped-java.yml', ref: 'main', inputs: { target_sha: head, pr_number: '49' } });
            core.info('Dispatched existing scoped workflow for work PR 49');
