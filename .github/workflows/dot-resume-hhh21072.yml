name: Resume HHH-21072 review stage
on:
  push:
    branches: [sandcastle/dot-resume/HHH-21072-review-20261107]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: hhh-21072-stage-recovery
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: recovery
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 08406741c41e200ae3e4edceebf467eb118ebfc1
          fetch-depth: 0
          path: target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xfocus3/sandcastle
          ref: 27aa174336534dd3c0d41a1765a03e2c072ddc5c
          path: sandcastle-tool
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare original tool
        working-directory: sandcastle-tool
        run: npm ci && npm run build
      - name: Configure disposable identity
        working-directory: target
        run: |
          git config user.name xfocus3
          git config user.email xfocus29@gmail.com
      - name: Assemble verified recovery record
        working-directory: recovery
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const read = name => JSON.parse(zlib.gunzipSync(fs.readFileSync('.sandcastle/recovery/' + name + '.json.gz')));
          const stage = read('stage');
          const request = read('request');
          for (const item of [stage, request]) {
            const { hash, ...data } = item;
            if (crypto.createHash('sha256').update(JSON.stringify(data)).digest('hex') !== hash) throw new Error('Recovery content hash mismatch');
          }
          const record = { stage, exchanges: [{ request }], lease: { ref: 'refs/heads/' + stage.env.BRANCH, head: stage.snapshot.head } };
          fs.writeFileSync('.sandcastle/recovery/resume.json', JSON.stringify(record));
          NODE
      - name: Reconcile and restart original stage
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/dot-stage-output
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawn, execFileSync } = require('node:child_process');
            const { createHash } = require('node:crypto');
            const root = process.env.GITHUB_WORKSPACE;
            const target = path.join(root, 'target');
            const tool = path.join(root, 'sandcastle-tool');
            const record = JSON.parse(fs.readFileSync(path.join(root, 'recovery/.sandcastle/recovery/resume.json'), 'utf8'));
            const stage = record.stage;
            const expectedHead = '08406741c41e200ae3e4edceebf467eb118ebfc1';
            const old = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 42352032683 })).data;
            if (old.status !== 'completed' || old.conclusion !== 'cancelled' || old.run_attempt !== 1 || old.event !== 'pull_request_target' || old.head_sha !== expectedHead) throw new Error('Original run identity or terminal state changed');
            const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: old.id })).data.artifacts;
            const expected = ['dot-stage-input-' + stage.id, 'dot-request-' + record.exchanges[0].request.id];
            if (artifacts.length !== 2 || artifacts.some(a => !expected.includes(a.name))) throw new Error('Prior stage effects require reconciliation');
            try {
              await github.rest.repos.getContent({ ...context.repo, path: 'responses/' + record.exchanges[0].request.id + '.json', ref: 'sandcastle-dot-responses' });
              throw new Error('Prior response exists; reconcile before restart');
            } catch (error) { if (error.status !== 404) throw error; }
            const ref = (await github.rest.git.getRef({ ...context.repo, ref: 'heads/' + stage.env.BRANCH })).data;
            if (ref.object.sha !== expectedHead || stage.snapshot.head !== expectedHead) throw new Error('Task branch advanced');
            for (const status of ['in_progress', 'queued', 'waiting', 'requested', 'pending']) {
              const runs = (await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, status, per_page: 100 })).data.workflow_runs;
              if (runs.some(run => run.id !== context.runId)) throw new Error('Another run may own work; reconcile first');
            }
            const git = (cwd, ...args) => execFileSync('git', args, { cwd, encoding: 'utf8' }).trim();
            const paths = ['src', 'package.json', 'package-lock.json', 'tsconfig.json', 'tsup.config.ts', 'scripts', '.sandcastle/agent-workflows', '.github/workflows'];
            const digest = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
            const controller = digest({ tool: git(tool, 'ls-tree', '-r', 'HEAD', '--', ...paths), workflows: git(target, 'ls-tree', '-r', 'HEAD', '--', '.github/workflows') });
            if (controller !== stage.controllerHash) throw new Error('Original controller differs');
            const restore = { id: stage.id, snapshot: stage.snapshot };
            const restoreFile = path.join(process.env.RUNNER_TEMP, 'verified-boundary.json');
            fs.writeFileSync(restoreFile, JSON.stringify({ ...restore, hash: digest(restore) }));
            execFileSync(process.execPath, [path.join(tool, 'scripts/dot-restore.mjs'), restoreFile, target], { stdio: 'inherit' });
            console.log('Starting a fresh original implement-pr stage from verified unchanged boundary; this is not checkpoint replay.');
            await new Promise((resolve, reject) => {
              const child = spawn(process.execPath, [path.join(tool, 'node_modules/tsx/dist/cli.mjs'), path.join(tool, 'scripts/dot/stage.ts'), stage.script], { cwd: target, stdio: 'inherit', env: { ...process.env, ...stage.env } });
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error('Fresh stage exited with code ' + code)));
            });
      - name: Preserve stage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhh-21072-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/dot-stage-output
            target/.git/sandcastle-dot/stage/status.json
            target/.git/sandcastle-dot/journal.json
          if-no-files-found: warn
