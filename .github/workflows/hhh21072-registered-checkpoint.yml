name: Preserve reviewed HHH-21072 result
on:
  push:
    branches: [sandcastle/dot-checkpoint/HHH-21072-registered-20261107]
permissions:
  contents: write
  actions: read
concurrency:
  group: hhh-21072-registered-result-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 425702571fda1c08a78d0c5d57e0be73d18293b4
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2f4b9539c89a92fde9602b01ead4f8e682b84291
          fetch-depth: 0
          path: target
          persist-credentials: false
      - name: Verify tested evidence and original branch lease
        uses: actions/github-script@v7
        with:
          script: |
            const checked = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 42392215242 })).data;
            if (checked.status !== 'completed' || checked.conclusion !== 'success' || checked.head_sha !== '425702571fda1c08a78d0c5d57e0be73d18293b4' || checked.path !== '.github/workflows/hhh21072-registered-check.yml' || checked.run_attempt !== 1) throw new Error('Exact evidence run not successful');
            const ref = (await github.rest.git.getRef({ ...context.repo, ref: 'heads/agent/issue-43-hhh-21072-fix-criteria-enum-literals-with-constant' })).data;
            if (ref.object.sha !== '2f4b9539c89a92fde9602b01ead4f8e682b84291') throw new Error('Original task branch advanced');
      - name: Publish only reviewed source checkpoint
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --check ../evidence/patches/HHH-21072-registered.patch
          git apply --index ../evidence/patches/HHH-21072-registered.patch
          test "$(git write-tree)" = '39aa13954b74d78182be275415d13702b91304c1'
          git diff --cached --check
          git config user.name xfocus3
          git config user.email xfocus29@gmail.com
          git commit -m "fix: HHH-21072 preserve registered enum literal mappings [skip ci]"
          test "$(git show -s --format='%an <%ae>|%cn <%ce>')" = 'xfocus3 <xfocus29@gmail.com>|xfocus3 <xfocus29@gmail.com>'
          ref=refs/heads/sandcastle/dot-result/HHH-21072-registered-20261107
          test -z "$(git ls-remote --heads origin "$ref")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force-with-lease="$ref:" origin "HEAD:$ref"
          git rev-parse HEAD
