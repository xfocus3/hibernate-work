name: Implement private PR
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write
jobs:
  pipeline:
    if: (github.event_name == 'pull_request_target' && github.event.label.name == 'agent:implement')
    uses: xfocus3/sandcastle/.github/workflows/agent-pr-queue.yml@950f2933a4a82631227c8cdfe860628fdfa1ba80
    with:
      upstream_repository: hibernate/hibernate-orm
      mode: implement-pr
      pr_number: ${{ github.event.pull_request.number || 0 }}
