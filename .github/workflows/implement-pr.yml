name: Implement private PR
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write
jobs:
  pipeline:
    if: (github.event_name == 'pull_request_target' && github.event.label.name == 'agent:implement')
    uses: xfocus3/sandcastle/.github/workflows/agent-pr-queue.yml@f3882b8dc00d9c335517908e5b99269a7f75d127
    with:
      mode: implement-pr
      pr_number: ${{ github.event.pull_request.number || 0 }}
