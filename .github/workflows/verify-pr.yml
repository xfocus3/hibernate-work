name: Verify private PR
on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [Implement private issue, Implement private PR, Update private PR branch]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open private PR number (0 scans the review queue)
        type: number
        default: 0
permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: write
jobs:
  pipeline:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.label.name == 'agent:review') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    uses: xfocus3/sandcastle/.github/workflows/agent-verification-queue.yml@ff275024be582b9e7553795e87926135020ccf1c
    with:
      verification_workflows: '[{"path":".github/workflows/scoped-java.yml","source":"target-sha","ref":"main"}]'
      tool_ref: 1b447693eb568012c9a9fbb3bd23f3b49ae01413
      pr_number: ${{ fromJSON(format('{0}', github.event.pull_request.number || inputs.pr_number || 0)) }}
