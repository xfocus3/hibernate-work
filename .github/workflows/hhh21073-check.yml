name: Verify HHH-21073 nullable pagination
on:
  push:
    branches: [sandcastle/dot-check/HHH-21073-20261107]
permissions:
  contents: read
jobs:
  verify:
    uses: xfocus3/sandcastle/.github/workflows/java-target-check.yml@49c6d695a59a46f3e693555ffe949ea1f0959748
    with:
      target_sha: a27b439b2dc96cf0bd0bf8f76ab33ff6d5664b25
      patch_ref: ${{ github.sha }}
      patch_path: patches/HHH-21073.patch
      arguments: '["hibernate-core:test","--rerun","--tests","org.hibernate.orm.test.paging.keybased.*","-Pdb=h2","formatChecks"]'
      database: h2
      java_version: '25'
      build_tool: gradle
