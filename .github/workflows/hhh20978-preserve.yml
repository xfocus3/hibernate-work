name: Preserve HHH-20978 exploration handoff
on:
  push:
    branches: [sandcastle/dot-checkpoint/HHH-20978-20261108]
    paths: [.github/workflows/hhh20978-preserve.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42477842079'
          artifact-ids: '13616630828,13616068060,13616069444'
          path: checkpoints/HHH-20978/explore
      - name: Validate original public-source handoff
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const expected=new Set(['c5c06a2d-c83e-4136-b4d0-d794fe0ba4ea','a3a70808-3786-44ba-9ae2-b4a0b18ce9b4','5ffecac1-5f88-42ea-9895-2ebdd96ac41a']),seen=new Set();
          function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else {if(!e.name.endsWith('.json'))throw Error('Unexpected file');const raw=fs.readFileSync(p,'utf8'),{hash,...r}=JSON.parse(raw);if(!expected.has(r.id)||r.repository!=='xfocus3/hibernate-work'||r.runId!=='42477842079'||r.runAttempt!=='1'||r.snapshot.head!=='99489d519a023b37cb83c1a89b73ae499113e089'||r.snapshot.files.length||crypto.createHash('sha256').update(JSON.stringify(r)).digest('hex')!==hash)throw Error('Identity mismatch');if(/\/(?:home|Users|workspace|tmp)\//.test(JSON.stringify({...r,snapshot:undefined})))throw Error('Public checkpoint privacy review required');seen.add(r.id);}}}
          walk('checkpoints/HHH-20978/explore');if(seen.size!==expected.size)throw Error('Missing snapshot');
          JS
          git config user.name xfocus3
          git config user.email xfocus29@gmail.com
          git add checkpoints/HHH-20978/explore
          git diff --cached --check
          git commit -m "HHH-20978 Preserve verified exploration handoff [skip ci]"
          git push origin HEAD:sandcastle/dot-checkpoint/HHH-20978-20261108
