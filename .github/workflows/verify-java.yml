      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run RED on unchanged production
        if: matrix.variant == 'red'
        working-directory: target
        run: ./gradlew --no-daemon hibernate-core:test --tests 'org.hibernate.orm.test.type.descriptor.java.BasicCollectionJavaTypeTest.reorderedDuplicateHeavyBagsAreComparedLinearly' -Pdb=h2
      - name: Run GREEN H2 regressions
        if: matrix.variant == 'green'
        working-directory: target
        run: ./gradlew --no-daemon hibernate-core:test --tests 'org.hibernate.orm.test.type.descriptor.java.BasicCollectionJavaTypeTest' --tests 'org.hibernate.orm.test.type.BasicCollectionFlushTest' -Pdb=h2
      - name: Check style
        if: matrix.variant == 'green'
        working-directory: target
        run: |
          git diff --cached --check
          ./gradlew --no-daemon hibernate-core:spotlessCheck
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hhh-21149-${{ matrix.variant }}
          path: |
            verification.txt
            target/hibernate-core/target/test-results/**/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
