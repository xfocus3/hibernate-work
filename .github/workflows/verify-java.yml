name: Verify Java tracer bullet
run-name: HHH-21149 bag dirty-checking exact-head proof
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        variant: [red, green]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
