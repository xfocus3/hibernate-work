name: Verify Java tracer bullet
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact upstream or work commit
        type: string
        required: true
      patch_ref:
        description: Exact private commit containing the prepared patch
        type: string
        required: true
      patch_path:
        description: Repository-relative patch path
        type: string
        required: true
      arguments:
        description: Gradle argument JSON array
        type: string
        required: true
        default: '["hibernate-core:test","--tests","org.hibernate.orm.test.pagination.CollectionFetchPredicatePaginationTest","-Pdb=h2"]'
permissions:
  contents: read
jobs:
  verify:
    uses: xfocus3/sandcastle/.github/workflows/java-target-check.yml@13e1155af20e0777b06513d1fdf530b549973fc5
    with:
      target_sha: ${{ inputs.target_sha }}
      patch_ref: ${{ inputs.patch_ref }}
      patch_path: ${{ inputs.patch_path }}
      arguments: ${{ inputs.arguments }}
      java_version: '25'
      build_tool: gradle
