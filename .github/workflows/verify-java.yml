        with:
          repository: xfocus3/hibernate-orm
          ref: 60a0374eac3e66c3b69899df67a9aef237c8ad5b
          path: target
          persist-credentials: false
      - name: Apply the pinned HHH-21149 patch
        working-directory: target
        env:
          VARIANT: ${{ matrix.variant }}
