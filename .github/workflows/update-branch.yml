name: Update private PR branch
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write
jobs:
  pipeline:
    if: (github.event_name == 'pull_request_target' && github.event.label.name == 'agent:update-branch')
    uses: xfocus3/sandcastle/.github/workflows/agent-pr-queue.yml@32ec5e87468c53c4ce6bc74b457501a2150f7bce
    with:
      mode: update-branch
      pr_number: ${{ github.event.pull_request.number || 0 }}
