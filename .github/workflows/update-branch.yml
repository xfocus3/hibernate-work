name: Update private PR branch
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: write
  issues: read
  pull-requests: write
jobs:
  pipeline:
    if: (github.event_name == 'pull_request_target' && github.event.label.name == 'agent:update-branch')
    uses: xfocus3/sandcastle/.github/workflows/agent-pr-queue.yml@2ca344c1eadb78f4e096423ca18e04bad178696f
    with:
      mode: update-branch
      pr_number: ${{ github.event.pull_request.number || 0 }}
