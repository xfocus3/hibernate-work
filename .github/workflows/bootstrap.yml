name: Bootstrap upstream baseline
on:
  push:
    paths: [.github/workflows/bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    uses: xfocus3/sandcastle/.github/workflows/sync-upstream.yml@0e3a0d3ff732c705f6d4f68cd67f63f7d9f77fce
    secrets:
      upstream_sync_token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
    with:
      upstream_repository: hibernate/hibernate-orm
      upstream_branch: main
      baseline_branch: upstream-main
