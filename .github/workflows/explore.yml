name: Explore private issues
on:
  issues:
    types: [labeled]
  push:
    paths: [.github/workflows/explore.yml]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  sync:
    if: github.event_name != 'issues' || github.event.label.name == 'agent:explore'
    uses: xfocus3/sandcastle/.github/workflows/sync-upstream.yml@80f457b2b99f5b417d15425c97a953eba87e4ee8
    secrets:
      upstream_sync_token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
    with:
      allow_public_workspace: true
      upstream_repository: hibernate/hibernate-orm
      upstream_branch: main
      baseline_branch: upstream-main
  explore:
    needs: sync
    uses: xfocus3/sandcastle/.github/workflows/agent-explore-target.yml@74a9bb7adf4e34bb1e0393664c0dc161d3220765
    with:
      upstream_repository: ${{ github.repository }}
      target_ref: ${{ needs.sync.outputs.sha }}
      tool_ref: 74a9bb7adf4e34bb1e0393664c0dc161d3220765
      dry_run: false
