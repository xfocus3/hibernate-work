name: Explore private issues
on:
  issues:
    types: [labeled]
  push:
    paths: [.github/workflows/explore.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  explore:
    if: github.event_name != 'issues' || github.event.label.name == 'agent:explore'
    uses: xfocus3/sandcastle/.github/workflows/agent-explore-target.yml@5f3b071e10aad4b15e14354e8bd8d954f4698843
    with:
      upstream_repository: hibernate/hibernate-orm
      target_ref: main
      tool_ref: 5f3b071e10aad4b15e14354e8bd8d954f4698843
      dry_run: true
