name: Review private PR
on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [Implement private issue, Implement private PR, GH Actions CI, GitHub Actions linter]
    types: [completed]
permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write
jobs:
  pipeline:
    if: (github.event_name == 'pull_request_target' && github.event.label.name == 'agent:review') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    uses: xfocus3/sandcastle/.github/workflows/agent-pr-queue.yml@f3882b8dc00d9c335517908e5b99269a7f75d127
    with:
      verification_workflows: '[".github/workflows/ci.yml", ".github/workflows/actionlint.yml"]'
      mode: review
      pr_number: ${{ github.event.pull_request.number || 0 }}
