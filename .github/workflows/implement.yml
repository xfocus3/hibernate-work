name: Implement private issue
on:
  issues:
    types: [labeled]
  workflow_run:
    workflows: [Explore private issues]
    types: [completed]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  pipeline:
    uses: xfocus3/sandcastle/.github/workflows/agent-implement-queue.yml@cf4d6f159e9ff959f451ea6a493c791e9fdcb2f2
    secrets:
      upstream_sync_token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
    with:
      allow_public_workspace: true
      upstream_repository: hibernate/hibernate-orm
