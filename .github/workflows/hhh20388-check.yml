name: Verify HHH-20388 native alias injection
on:
  push:
    branches: [sandcastle/dot-check/HHH-20388-20261107]
    paths: [.github/workflows/hhh20388-check.yml, patches/HHH-20388.patch]
permissions:
  contents: read
jobs:
  verify:
    uses: xfocus3/sandcastle/.github/workflows/java-target-check.yml@49c6d695a59a46f3e693555ffe949ea1f0959748
    with:
      target_sha: 99489d519a023b37cb83c1a89b73ae499113e089
      patch_ref: ${{ github.sha }}
      patch_path: patches/HHH-20388.patch
      arguments: '["hibernate-core:test","--tests","org.hibernate.orm.test.query.sql.EmbeddedIdAliasInjectionTest","--tests","org.hibernate.orm.test.query.CompositeKeyNativeQueryTest","--tests","org.hibernate.orm.test.query.sql.EmbeddedIdNativeQueryTest","--tests","org.hibernate.orm.test.query.sql.CompositeIdNativeQueryTest","-Pdb=h2","formatChecks"]'
      database: h2
      java_version: '25'
      build_tool: gradle
